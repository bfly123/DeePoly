problem_type: time_pde
method: deepoly
eq:
  L1:
  - -0.0001*diff(u,x,2)
  L2:
  - '0'
  F:
  - '1'
  N:
  - -5*u+5*u**3
vars_list:
- u
spatial_vars:
- x
Initial_conditions:
- var: u
  value: x**2*cos(pi*x)
boundary_conditions:
- type: dirichlet
  region: left
  var: u
  value: -1
  points: 128
  weight: 10
- type: dirichlet
  region: right
  var: u
  value: -1
  points: 128
  weight: 10
hidden_dims:
- 12
- 48
- 48
- 48
learning_rate: 0.01
n_segments:
- 4
poly_degree:
- 6
x_domain:
- - -1
  - 1
points_domain:
- 200
points_domain_test:
- 1024
points_per_swap: 10
T: 1.0
dt: 0.0025
time_scheme: IMEX_RK_2_2_2
time_scheme_params:
  time_output_interval: 5
  adaptive_dt: false
  stability_check: true
  max_eigenvalue_estimate: 100.0
spotter_skip: 4
epochs_adam: 3000
epochs_lbfgs: 0
max_retries: 2
DNNtol: 8.0e-05
linear_method: gpu_svd
linear_rcond: 1.0e-12
reference_solution: ../../../pseudotime_pde_cases/AC_equation/reference_data/allen_cahn_highres.mat
realtime_visualization: false
animation_skip: 5
max_visualization_frames: 250
plot_nn_predictions: false
device: cpu
linear_device: cpu
seed: 42
auto_code: false
nn_backend: torch
