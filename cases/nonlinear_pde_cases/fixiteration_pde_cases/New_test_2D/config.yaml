problem_type: fixiteration_pde
method: deepoly
eq:
  L1:
  - -0.0001*diff(u,x,2)+diff(u,y)
  L2:
  - '0'
  F:
  - '0'
  N:
  - -5*u+5*u**3
  S:
  - '0'
vars_list:
- u
spatial_vars:
- x
- y
boundary_conditions:
- type: periodic
  pairs:
  - left
  - right
  points: 500
  weight: 1
  var: u
- type: dirichlet
  region: bottom
  var: u
  formula: x**2 * cos(pi * x)
  points: 500
  weight: 10
hidden_dims:
- 128
- 128
- 128
- 128
- 128
- 128
epochs_adam: 100000
epochs_lbfgs: 0
max_retries: 0
DNNtol: 1.0e-05
learning_rate: 0.001
n_segments:
- 5
- 3
points_domain: 10000
points_per_swap: 10
points_domain_test:
- 512
- 201
poly_degree:
- 9
- 6
x_domain:
- - -1
  - 1
- - 0
  - 1
fixiteration:
  max_iterations: 1
  residual_tol: 1.0e-06
  check_interval: 10
  print_interval: 1
  save_interval: 100
initial_condition:
  method: bc_pinn
  bc_pinn_config:
    block_axis: y
    n_time_blocks: 4
    epochs_per_block: 1000
    warmup_learning_rate: 0.01
    learning_rate: 0.001
    collocation_points: 12000
    x_line_points: 128
    total_time_points: 201
    block_time_points: 51
    boundary_time_points: 25
    interface_weight: 64.0
    history_weight: 64.0
    guidance_weight: 1.0
    warmup_ratio: 0.1
    freeze_hidden_layers: 2
    interface_points: 128
    history_points: 0
    guidance_points: 0
    lbfgs_steps: 200
    history_mode: previous_only
    print_interval: 1000
spotter_skip: 1
run_snipper: false
reference_solution: reference_data/allen_cahn_highres.mat
realtime_visualization: false
animation_skip: 10
device: cuda
linear_device: cuda
seed: 42
auto_code: false
nn_backend: torch
