problem_type: fixiteration_pde
method: deepoly
eq:
  L1:
  - -0.0001*diff(u,x,2)+diff(u,y)
  L2:
  - '0'
  F:
  - '0'
  N:
  - -5*u+5*u**3
  S:
  - '0'
vars_list:
- u
spatial_vars:
- x
- y
boundary_conditions:
- type: periodic
  pairs:
  - left
  - right
  points: 120
  weight: 1
  var: u
- type: dirichlet
  region: bottom
  var: u
  formula: x**2 * cos(pi * x)
  points: 120
  weight: 10
hidden_dims:
- 8
epochs_adam: 2000
epochs_lbfgs: 0
max_retries: 0
DNNtol: 1.0e-05
learning_rate: 0.001
n_segments:
- 2
- 2
points_domain: 600
points_per_swap: 4
points_domain_test:
- 128
- 128
poly_degree:
- 5
- 4
x_domain:
- - -1
  - 1
- - 0
  - 1
fixiteration:
  max_iterations: 1
  residual_tol: 1.0e-06
  check_interval: 1
  print_interval: 1
  save_interval: 10
initial_condition:
  method: zero
spotter_feature_backend: torch
spotter_feature:
  allow_torch_training: true
spotter_skip: 1
run_snipper: true
reference_solution: ../New_test_2D/reference_data/allen_cahn_highres.mat
realtime_visualization: false
animation_skip: 10
device: cpu
linear_device: cpu
seed: 42
auto_code: false
nn_backend: torch
