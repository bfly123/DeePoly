[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepoly"
version = "0.1.0"
description = "CLI entry point for DeePoly case execution."
requires-python = ">=3.10"

[project.scripts]
deepoly = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
